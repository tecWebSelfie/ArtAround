include:
  - ./my-agent/compose.livekit.yaml #loads livekit server and related services
services:
  app:
    profiles:
      - devcontainer
    build:
      context: .
      dockerfile: Dockerfile.devcontainer
    env_file:
      - .env
    environment:
      DATABASE_URL: mongodb://mongodb:27017/artaround
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - .:/workspace:cached
      - node_modules:/workspace/node_modules
    working_dir: /workspace
    ports:
      - "3000:3000"
    command: sleep infinity
      
  mongodb:
    image: mongo:8
    restart: unless-stopped
    env_file:
      - .env.mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mongo-data:
  node_modules: