include:
  - ./my-agent/compose.livekit.yaml #loads livekit server and related services
services:
  app:
    profiles:
      - devcontainer
    build:
      context: .
      dockerfile: Dockerfile.devcontainer
    # DATABASE_URL comes from .env: mongodb://mongodb:27017/artaround
    # Optional so that `pnpm services:start` (`mongodb` and `livekit`) works before .env exists.
    env_file:
      - path: .env
        required: false
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - .:/workspace:cached
      - node_modules:/workspace/node_modules
    working_dir: /workspace
    ports:
      - '3000:3000'
    command: sleep infinity

  # Development and test database (`pnpm services:start`), without authentication:
  # a university project's local data, published on the loopback interface
  # only, so other machines on the same network can't reach it. The host's
  # DATABASE_URL is mongodb://127.0.0.1:27017/artaround.
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
      # Probe every second while starting (Docker 25+): `--wait` returns as
      # soon as it is up instead of after the first 5 s interval.
      start_interval: 1s

  # Development and test search engine (`pnpm services:start`): the same
  # Typesense the deployments reach on Typesense Cloud, as one local node, so
  # the search pages, the Payload hooks that index and the integration specs
  # run without a Cloud cluster. Loopback only, with a development key; the
  # app reaches it through the TYPESENSE_* variables of .env.example (there is
  # no fallback in code: an unset host still reads as "search unavailable").
  typesense:
    image: typesense/typesense:30.1
    restart: unless-stopped
    command: ['--data-dir', '/data', '--api-key', 'xyz', '--enable-cors=false']
    ports:
      - '127.0.0.1:8108:8108'
    volumes:
      - typesense-data:/data
    healthcheck:
      # The image has no curl or wget: bash's /dev/tcp asks /health itself.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8108 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && grep -q "\"ok\":true" <&3'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
      start_interval: 1s

volumes:
  mongo-data:
  typesense-data:
  node_modules:
