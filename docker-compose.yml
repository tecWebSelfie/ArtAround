include:
  - ./my-agent/compose.livekit.yaml #loads livekit server and related services
services:
  app:
    profiles:
      - devcontainer
    build:
      context: .
      dockerfile: Dockerfile.devcontainer
    # DATABASE_URL comes from .env: mongodb://mongodb:27017/artaround
    # Optional so that `pnpm db:start` (only `mongodb`) works before .env exists.
    env_file:
      - path: .env
        required: false
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - .:/workspace:cached
      - node_modules:/workspace/node_modules
    working_dir: /workspace
    ports:
      - '3000:3000'
    command: sleep infinity

  # Development and test database (`pnpm db:start`), without authentication:
  # a university project's local data, published on the loopback interface
  # only, so other machines on the same network can't reach it. The host's
  # DATABASE_URL is mongodb://127.0.0.1:27017/artaround.
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mongo-data:
  node_modules:
