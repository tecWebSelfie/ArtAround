# Optional: the root compose includes this file, and `pnpm services:start`
# (MongoDB and the local LiveKit) must not need the agent's secrets.
x-env-config: &env-local
  env_file:
    - path: .env.local
      required: false

services:  
  livekit:
    image: livekit/livekit-server
    <<: *env-local
    # Like MongoDB: back after a Docker restart (on a PC, Docker Desktop
    # restarts it; in a cloud session `pnpm services:start` starts both again).
    restart: unless-stopped
    # --node-ip: advertise the host's loopback for WebRTC. Without it the
    # server offers its container IP, browsers never finish connecting, and
    # rooms (group tours) hang in "connecting".
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7880 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
      # Probe every second while starting (Docker 25+), as for MongoDB.
      start_interval: 1s
  livekit-dashboard:
    <<: *env-local
    image: jossephus/livekit-monitor:latest
    depends_on:
      livekit:
        condition: service_healthy
    ports:
      - "3001:3000"
    volumes:
      - "livekit-monitor-data:/data"
    environment:
      LIVEKIT_URL: "http://host.docker.internal:7880"
      PORT: "3000"

volumes:
  livekit-monitor-data: