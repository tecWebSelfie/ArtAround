on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  deploy:
    name: deploy to gualtiero
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands using SSH key
        uses: appleboy/ssh-action@v1
        with:
          username: ${{ secrets.USERNAME }}
          host: ${{ secrets.HOST }}
          key: ${{ secrets.GUALTIERO_SSH_KEY }}
          script: |
            whoami
