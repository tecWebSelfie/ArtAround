on:
  push:
    branches-ignore:
      - main
  workflow_dispatch: 

jobs:
  deploy:
    name: deploy to gualtiero
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands using SSH key
        uses: appleboy/ssh-action@v1
        env:
          SERVER_PROJECT_PATH: ${{ vars.SERVER_PROJECT_PATH }}
          BRANCH: ${{ github.ref_name }}
        with:
          username: ${{ secrets.USERNAME }}
          host: ${{ secrets.HOST }}
          key: ${{ secrets.GUALTIERO_SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          envs: SERVER_PROJECT_PATH,BRANCH
          script: |
            set -e

            export PATH="$HOME/.local/bin:$PATH"

            # Storage outside the home-directory quota
            export PUBLIC_DIR="/public/michelegennari3"

            export MISE_DATA_DIR="$PUBLIC_DIR/mise-data"
            export MISE_CACHE_DIR="$PUBLIC_DIR/mise-cache"
            export MISE_STATE_DIR="$PUBLIC_DIR/mise-state"
            export PNPM_STORE_DIR="$PUBLIC_DIR/pnpm-store"

            mkdir -p \
              "$MISE_DATA_DIR" \
              "$MISE_CACHE_DIR" \
              "$MISE_STATE_DIR" \
              "$PNPM_STORE_DIR"

            chmod -R 770 "$PUBLIC_DIR"

            # Fail early if the directory is not writable
            test -w "$PUBLIC_DIR"

            git config --global --add safe.directory "$SERVER_PROJECT_PATH"

            if ! command -v mise >/dev/null 2>&1; then
              curl -fsSL https://mise.run | sh
            fi

            cd "$SERVER_PROJECT_PATH"

            git fetch --all --prune
            git stash
            git checkout -B "$BRANCH" "origin/$BRANCH"

            rm -rf node_modules

            eval "$(mise activate bash)"
            mise install -v

            mise exec -- pnpm install \
              --store-dir "$PNPM_STORE_DIR" \
              --frozen-lockfile
