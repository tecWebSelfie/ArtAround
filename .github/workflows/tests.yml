# Full test run on GitHub's runners, in three parallel jobs:
# - `tests`: integration specs, then, on the production build served by
#   `pnpm start`, the nightly QA regression specs and the Playwright e2e suite;
# - `stories`: every Storybook story as a test in Chromium (render, play
#   function, accessibility checks);
# - `static`: typecheck, type-aware lint, the dependency-boundary and
#   naming checks, and the i18next key check - the whole-program checks,
#   run here so no one has to run them by hand (the
#   hooks cover less: pre-commit lints only the staged files, pre-push
#   only typechecks).
# Integration specs and stories run with V8 coverage: the same tests, which
# also record the lines they executed (one report per job, as artifacts).
#
# Asynchronous: it never blocks pushes, commits or other PRs. Its result shows
# as a check on the pull request; a merge waits for it only if branch
# protection marks it as required (repository settings). A new push to the
# same PR cancels the run still going for the previous one.
#
# Visual regression tests (`pnpm test:visual`) run in their own lane
# (.github/workflows/visual.yml): nightly and on demand, never per PR.
#
# AI: pull requests run on the AI SDK's mock models (AI_MOCK=true,
# src/lib/ai-models.ts), so they need no keys and get the same answers every
# time. "Run workflow" with "real AI" checked calls Groq and Fish Audio for
# real; that needs the repository secrets GROQ_API_KEY and FISH_API_KEY
# (Settings → Secrets and variables → Actions).
#
# Deploy: on the default branch a fourth job, `deploy`, waits for the
# three above and rsyncs the standalone build to the hosting folder of
# the `unibo` environment. The nodemon container watching that folder
# restarts the app by itself, and the deployment the job creates on
# success is what triggers the web-vitals canary
# (.github/workflows/web-vitals-canary.yml) against the deployed app.
name: Tests

on:
  pull_request:
  # The default branch: a merged PR (or a direct push) runs the same jobs
  # as a pull request, and a green run is what the `deploy` job below
  # waits for.
  push:
    branches: [db-populate]
  workflow_dispatch:
    inputs:
      real_ai:
        description: Call Groq and Fish Audio for real (needs their secrets)
        type: boolean
        default: false

concurrency:
  group: tests-${{ github.ref }}
  # A new PR push cancels the run still going for it; runs on the default
  # branch queue instead, so a push can never kill a deploy mid-rsync.
  cancel-in-progress: ${{ github.ref != 'refs/heads/db-populate' }}

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      # The same local services as a developer's `pnpm services:start`.
      DATABASE_URL: mongodb://127.0.0.1:27017/artaround
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      # The compose Typesense node (docker-compose.yml), as in .env.example.
      TYPESENSE_HOST: 127.0.0.1
      TYPESENSE_PORT: '8108'
      TYPESENSE_PROTOCOL: http
      TYPESENSE_API_KEY: xyz
      NEXT_PUBLIC_PAYLOAD_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # tour-guidance drives the simulated GPS (src/.../gps-source.ts).
      NEXT_PUBLIC_GPS_SIMULATOR: 'true'
      # GitHub's runners have no GPU: maps draw on software WebGL, and two
      # group-tour pages rendering at full rate starved the host's input
      # and LiveKit pings (a click never got two stable frames). This makes
      # tests/helpers/software-webgl.ts throttle their animation frames.
      E2E_SOFTWARE_WEBGL: 'true'
      AI_MOCK: ${{ inputs.real_ai && 'false' || 'true' }}
      GROQ_API_KEY: ${{ inputs.real_ai && secrets.GROQ_API_KEY || '' }}
      FISH_API_KEY: ${{ inputs.real_ai && secrets.FISH_API_KEY || '' }}
    steps:
      - uses: actions/checkout@v5

      # pnpm version from package.json's `packageManager`.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A throwaway secret per run; the rest of the config comes from `env`.
      - name: Write .env
        run: echo "PAYLOAD_SECRET=$(openssl rand -hex 24)" > .env

      # MongoDB, Typesense and LiveKit from docker-compose.yml, as on a developer machine.
      - run: pnpm services:start

      # `test:int` with coverage: the same specs, plus the report.
      - name: Integration tests
        run: pnpm test:coverage

      - name: Upload the integration coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-int
          path: coverage/
          retention-days: 14

      - name: Seed the e2e database
        run: pnpm seed:e2e

      # Next's build cache (.next/cache) between runs of the same lockfile.
      - uses: actions/cache@v5
        with:
          path: .next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm build

      - uses: ./.github/actions/playwright-chromium

      # One production server for both suites: the nightly QA regression
      # specs (tests/int/nightly/) call it over HTTP, then Playwright reuses
      # it (`reuseExistingServer`) instead of starting its own.
      - name: Start the production server
        run: |
          pnpm start > next-server.log 2>&1 &
          for _ in $(seq 60); do curl -sf -o /dev/null http://localhost:3000/en/navigator && exit 0; sleep 2; done
          cat next-server.log; exit 1

      - name: Nightly QA regression specs
        run: pnpm test:nightly

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            next-server.log
          retention-days: 14

  # Stories need no database, server or build: MSW mocks the network. About
  # 2.5 minutes and up to ~11 GB of memory, within a public repository's
  # runner (16 GB).
  stories:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/playwright-chromium

      - name: Story tests
        run: pnpm test:stories --coverage

      - name: Upload the stories coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-stories
          path: coverage/
          retention-days: 14

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Also generates the route types the lint below reads.
      - run: pnpm typecheck
      - run: pnpm lint:type-aware
      # Static guards, a few seconds each (docs/development.md): the
      # browser/Typesense boundary and the file naming conventions.
      - run: pnpm lint:deps
      - run: pnpm lint:names
      # Fails when a `t()` call's key is missing from (or stale in) en.json.
      - run: pnpm exec i18next-cli extract --ci

  # The deploy: the standalone build rsynced to the hosting folder of the
  # `unibo` environment, after the three jobs above go green. PR runs never
  # deploy (the `if` below); "Run workflow" from db-populate is the manual
  # redeploy. Referencing the environment scopes its secrets to this job,
  # puts the run on the repository's deployments page, and on success fires
  # the deployment_status that starts the web-vitals canary
  # (.github/workflows/web-vitals-canary.yml). The nodemon container
  # watching the deploy folder recreates the app process by itself
  # (docs/standalone-deploy.md): the rsync is the whole deploy.
  deploy:
    needs: [tests, stories, static]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/db-populate'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: unibo
      # The "View deployment" link on the deployments page.
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The server's .env is the single source of truth, for the runtime as
      # always and for the build-time NEXT_PUBLIC_* too: fetched here before
      # the build, never written back (the rsync below excludes .env*). Its
      # values must never reach this public repository's logs: only key
      # names are ever printed.
      - name: Fetch the server's .env
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_FOLDER: ${{ vars.DEPLOY_FOLDER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          # A secret that is missing or empty maps here to an empty string,
          # and the rsync below would then knock on the server's door as
          # "@host": own that case with a message naming the secret, instead
          # of letting SSH answer with a bare "Permission denied".
          test -n "$SSH_USER" ||
            { echo "::error::The SSH_USER secret of the unibo environment is missing or empty"; exit 1; }
          # The runner's bash -e would end the step right at any rsync
          # failure: own it here too, naming both real causes (SSH refused
          # the key, or no .env in the deploy folder yet).
          rsync "$SSH_USER@$SSH_HOST:$DEPLOY_FOLDER/.env" .env ||
            { echo "::error::Fetching the server's .env failed: SSH rejected the connection (see the lines above) or no .env is in the deploy folder yet — place it once by hand (docs/standalone-deploy.md)"; exit 1; }
          test -s .env ||
            { echo "::error::The .env fetched from the deploy folder is empty"; exit 1; }
          for key in NEXT_PUBLIC_APP_URL NEXT_PUBLIC_PAYLOAD_URL; do
            grep -q "^$key=" .env ||
              { echo "::error::The server's .env has no $key: the build would bake an empty origin into the bundle"; exit 1; }
          done

      - uses: actions/cache@v5
        with:
          path: .next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-

      # No database needed (docs/standalone-deploy.md, "Build without a
      # database"): the fetched .env rides along, copied into the standalone
      # by the build, excluded from the rsync below.
      - run: pnpm build

      # The incident guard (23 Nov 2026): a Turbopack build can list chunk
      # files in its HTML/manifests that it never wrote to disk, and nothing
      # else in the pipeline compares the two — such a deploy leaves every
      # page unhydrated ("client-side exception") and the dynamic routes
      # erroring, with no red anywhere. Red here means the build is broken:
      # ship nothing until it is green. Extract every chunk name the build
      # itself references and require each to exist on disk.
      - name: Every referenced chunk must exist on disk
        run: |
          grep -rhoE 'chunks/[A-Za-z0-9._-]+\.(js|css)' .next/standalone/.next/server \
            | sed 's|^chunks/||' | sort -u > referenced.txt
          miss=0
          while read -r f; do
            [ -e ".next/standalone/.next/static/chunks/$f" ] ||
              [ -e ".next/standalone/.next/server/chunks/$f" ] ||
              { echo "MISSING: $f"; miss=$((miss+1)); }
          done < referenced.txt
          echo "referenced chunks: $(wc -l < referenced.txt), missing: $miss"
          test "$miss" -eq 0 ||
            { echo "::error::The build references $miss chunk(s) it never wrote to disk — a deploy would ship pages that never hydrate (Turbopack cache/emission bug)"; exit 1; }

      # The manual procedure of docs/standalone-deploy.md with the runner as
      # the build folder: Linux (the pnpm symlinks come out right), outside
      # any quota. Reuses the fetch step's SSH setup.
      - name: rsync the standalone to the deploy folder
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_FOLDER: ${{ vars.DEPLOY_FOLDER }}
        run: |
          # -a preserves the pnpm symlinks. -z compresses the transfer (the
          # payload is text-heavy: node_modules and JS chunks). -c skips by
          # checksum the files a fresh build regenerated byte-identical —
          # their mtime is always new, so the default size+mtime quick check
          # would flag everything on every deploy — and skipped files keep
          # their stored mtime, so a redundant deploy of identical content
          # leaves nodemon alone. The server's .env is excluded: CI reads
          # that file and never writes it back. uploads/ is a sibling of the
          # deploy folder, outside this target.
          # No --delete here: the running server keeps rendering pages that
          # list the previous build's chunks until it restarts, and deleting
          # them now answers those requests 500 — pages that never hydrate
          # ("client-side exception", 25 Nov 2026 canary). The old files go
          # in the cleanup step, once the new build is live.
          # --stats reports what actually moved, and drives the restart
          # below: a change confined to .next/ (a dot directory nodemon does
          # not watch by default) otherwise never restarts the running app —
          # the 23 Nov 2026 deploy delivered a complete build that kept
          # serving the old one until it was restarted by hand.
          stats=$(rsync -azc --stats --exclude='.env*' \
            .next/standalone/ "$SSH_USER@$SSH_HOST:$DEPLOY_FOLDER/")
          echo "$stats"
          transferred=$(echo "$stats" \
            | sed -n 's/^Number of regular files transferred: \([0-9]*\).*/\1/p')
          if [ "${transferred:-0}" -gt 0 ]; then
            # server.js is a plain .js at the standalone root, outside any
            # dot directory: only its mtime changes, and only when the
            # bundle really did.
            ssh "$SSH_USER@$SSH_HOST" "touch '$DEPLOY_FOLDER/server.js'"
            echo "restart requested: $transferred file(s) transferred"
          else
            echo "nothing transferred, no restart"
          fi

      # A touched server.js is only a request: nothing in the pipeline saw
      # whether the app came back on the new build, and twice it did not
      # (23 and 25 Nov 2026: an orphaned server.js kept the port and served
      # the previous build). The served HTML carries the build ID in its
      # RSC payload ("b":"<id>"); wait until it is this build's. The boot
      # seeds and reindexes before it starts the server, hence the generous
      # wait. Red here leaves the previous build's chunks in place (the
      # cleanup below is skipped), so the site keeps working on the old
      # build while someone looks at the server.
      - name: The live site must serve this build
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          origin="${APP_URL%/}"
          build_id=$(cat .next/BUILD_ID)
          echo "waiting for build $build_id at $origin"
          for attempt in $(seq 1 60); do
            served=$(curl -fsS --max-time 20 "$origin/en/navigator" 2>/dev/null \
              | grep -oE '\\?"b\\?":\\?"[A-Za-z0-9_-]+' | head -n1 \
              | grep -oE '[A-Za-z0-9_-]+$' || true)
            if [ "$served" = "$build_id" ]; then
              echo "live on build $build_id after $attempt attempt(s)"
              exit 0
            fi
            echo "attempt $attempt: serving ${served:-nothing}"
            sleep 10
          done
          echo "::error::After 10 minutes $origin still serves build ${served:-none}, not $build_id: the app did not restart on the new build (see the boot's log in the container). The previous build's files were kept, so the site still runs the old build."
          exit 1

      # The new build is live: remove the files of the previous one (the
      # --delete the first rsync left out). Only files go away; they live
      # almost all under .next/ and node_modules/, which nodemon does not
      # watch, and a restart a deletion elsewhere might cause lands on the
      # same, complete new build.
      - name: Remove the previous build's files
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_FOLDER: ${{ vars.DEPLOY_FOLDER }}
        run: |
          rsync -azc --stats --delete --exclude='.env*' \
            .next/standalone/ "$SSH_USER@$SSH_HOST:$DEPLOY_FOLDER/"
