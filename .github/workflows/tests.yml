# Full test run on GitHub's runners, in three parallel jobs:
# - `tests`: integration specs, then, on the production build served by
#   `pnpm start`, the nightly QA regression specs and the Playwright e2e suite;
# - `stories`: every Storybook story as a test in Chromium (render, play
#   function, accessibility checks);
# - `static`: typecheck, type-aware lint and the i18next key check, the
#   whole-program checks, run here so no one has to run them by hand (the
#   hooks cover less: pre-commit lints only the staged files, pre-push
#   only typechecks).
# Integration specs and stories run with V8 coverage: the same tests, which
# also record the lines they executed (one report per job, as artifacts).
#
# Asynchronous: it never blocks pushes, commits or other PRs. Its result shows
# as a check on the pull request; a merge waits for it only if branch
# protection marks it as required (repository settings). A new push to the
# same PR cancels the run still going for the previous one.
#
# Visual regression tests (`pnpm test:visual`) stay out: they run on demand.
#
# AI: pull requests run on the AI SDK's mock models (AI_MOCK=true,
# src/lib/ai-models.ts), so they need no keys and get the same answers every
# time. "Run workflow" with "real AI" checked calls Groq and Fish Audio for
# real; that needs the repository secrets GROQ_API_KEY and FISH_API_KEY
# (Settings → Secrets and variables → Actions).
name: Tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      real_ai:
        description: Call Groq and Fish Audio for real (needs their secrets)
        type: boolean
        default: false

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      # The same local services as a developer's `pnpm services:start`.
      DATABASE_URL: mongodb://127.0.0.1:27017/artaround
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      NEXT_PUBLIC_PAYLOAD_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # tour-guidance drives the simulated GPS (src/.../gps-source.ts).
      NEXT_PUBLIC_GPS_SIMULATOR: 'true'
      # GitHub's runners have no GPU: maps draw on software WebGL, and two
      # group-tour pages rendering at full rate starved the host's input
      # and LiveKit pings (a click never got two stable frames). This makes
      # tests/helpers/software-webgl.ts throttle their animation frames.
      E2E_SOFTWARE_WEBGL: 'true'
      AI_MOCK: ${{ inputs.real_ai && 'false' || 'true' }}
      GROQ_API_KEY: ${{ inputs.real_ai && secrets.GROQ_API_KEY || '' }}
      FISH_API_KEY: ${{ inputs.real_ai && secrets.FISH_API_KEY || '' }}
    steps:
      - uses: actions/checkout@v5

      # pnpm version from package.json's `packageManager`.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A throwaway secret per run; the rest of the config comes from `env`.
      - name: Write .env
        run: echo "PAYLOAD_SECRET=$(openssl rand -hex 24)" > .env

      # MongoDB and LiveKit from docker-compose.yml, as on a developer machine.
      - run: pnpm services:start

      # `test:int` with coverage: the same specs, plus the report.
      - name: Integration tests
        run: pnpm test:coverage

      - name: Upload the integration coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-int
          path: coverage/
          retention-days: 14

      - name: Seed the e2e database
        run: pnpm seed:e2e

      # Next's build cache (.next/cache) between runs of the same lockfile.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm build

      - uses: ./.github/actions/playwright-chromium

      # One production server for both suites: the nightly QA regression
      # specs (tests/int/nightly/) call it over HTTP, then Playwright reuses
      # it (`reuseExistingServer`) instead of starting its own.
      - name: Start the production server
        run: |
          pnpm start > next-server.log 2>&1 &
          for _ in $(seq 60); do curl -sf -o /dev/null http://localhost:3000/en/navigator && exit 0; sleep 2; done
          cat next-server.log; exit 1

      - name: Nightly QA regression specs
        run: pnpm test:nightly

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            next-server.log
          retention-days: 14

  # Stories need no database, server or build: MSW mocks the network. About
  # 2.5 minutes and up to ~11 GB of memory, within a public repository's
  # runner (16 GB).
  stories:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/playwright-chromium

      - name: Story tests
        run: pnpm test:stories --coverage

      - name: Upload the stories coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-stories
          path: coverage/
          retention-days: 14

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Also generates the route types the lint below reads.
      - run: pnpm typecheck
      - run: pnpm lint:type-aware
      # Fails when a `t()` call's key is missing from (or stale in) en.json.
      - run: pnpm exec i18next-cli extract --ci
