# Full test run on GitHub's runners: integration specs, then the Playwright
# e2e suite against the production build (playwright.config.ts picks
# `pnpm start` when CI is set).
#
# Asynchronous: it never blocks pushes, commits or other PRs. Its result shows
# as a check on the pull request; a merge waits for it only if branch
# protection marks it as required (repository settings). A new push to the
# same PR cancels the run still going for the previous one.
#
# Visual regression tests (`pnpm test:visual`) stay out: they run on demand.
#
# AI: pull requests run on the AI SDK's mock models (AI_MOCK=true,
# src/lib/ai-models.ts), so they need no keys and get the same answers every
# time. "Run workflow" with "real AI" checked calls Groq and Fish Audio for
# real; that needs the repository secrets GROQ_API_KEY and FISH_API_KEY
# (Settings → Secrets and variables → Actions).
name: Tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      real_ai:
        description: Call Groq and Fish Audio for real (needs their secrets)
        type: boolean
        default: false

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      # The same local services as a developer's `pnpm services:start`.
      DATABASE_URL: mongodb://127.0.0.1:27017/artaround
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      NEXT_PUBLIC_PAYLOAD_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # tour-guidance drives the simulated GPS (src/.../gps-source.ts).
      NEXT_PUBLIC_GPS_SIMULATOR: 'true'
      AI_MOCK: ${{ inputs.real_ai && 'false' || 'true' }}
      GROQ_API_KEY: ${{ inputs.real_ai && secrets.GROQ_API_KEY || '' }}
      FISH_API_KEY: ${{ inputs.real_ai && secrets.FISH_API_KEY || '' }}
    steps:
      - uses: actions/checkout@v4

      # pnpm version from package.json's `packageManager`.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A throwaway secret per run; the rest of the config comes from `env`.
      - name: Write .env
        run: echo "PAYLOAD_SECRET=$(openssl rand -hex 24)" > .env

      # MongoDB and LiveKit from docker-compose.yml, as on a developer machine.
      - run: pnpm services:start

      - name: Integration tests
        run: pnpm test:int

      - name: Seed the e2e database
        run: pnpm seed:e2e

      # Next's build cache (.next/cache) between runs of the same lockfile.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm build

      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
